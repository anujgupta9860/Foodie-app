name: EAS Submit to TestFlight




on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Expo Build ID to submit (default: latest successful)'
        required: false
        default: '91651f79-af14-442c-bfe5-2f849edaefcb'




jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4




      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20




      - name: Install EAS CLI
        run: npm install -g eas-cli




      - name: Install dependencies
        run: npm ci




      - name: Write ASC API Key
        run: |
          echo "${{ secrets.ASC_KEY_P8 }}" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8




      - name: Submit to TestFlight
        run: |
          eas submit \
            --platform ios \
            --id ${{ inputs.build_id }} \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8

